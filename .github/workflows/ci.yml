name: CI

on:
  push:
    branches: [0.x]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # corepack activates the pnpm version pinned in package.json's
      # packageManager field, running under Node 22 (pnpm 11.4 needs >=22.13).
      # Using pnpm/action-setup instead fails: its installer runs under the
      # Actions runtime's Node 20, not the workflow's Node.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test
